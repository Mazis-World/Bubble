<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FamilyBubble Check in app plates</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #020617; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
    body {
      background:
        radial-gradient(900px 500px at 18% 18%, rgba(59, 130, 246, 0.28), transparent 55%),
        radial-gradient(800px 500px at 90% 80%, rgba(16, 185, 129, 0.16), transparent 50%),
        #020617;
    }
    .stage { width: 1920px; height: 1080px; display: flex; align-items: center; justify-content: center; gap: 80px; padding: 60px 100px; }
    .copy { flex: 1; }
    .kicker { color: #93c5fd; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; font-size: 22px; margin-bottom: 16px; }
    h1 { font-size: 62px; font-weight: 900; line-height: 1.08; margin-bottom: 18px; }
    .sub { font-size: 28px; color: rgba(255,255,255,0.78); max-width: 720px; }
    .phone {
      width: 390px; height: 800px; background: #0b1220; border-radius: 52px; padding: 14px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.55), 0 0 0 4px #1f2937; position: relative; flex-shrink: 0;
    }
    .notch { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); width: 128px; height: 22px; background: #020617; border-radius: 0 0 16px 16px; z-index: 5; }
    .screen { height: 100%; border-radius: 40px; overflow: hidden; position: relative; background: #0b1b33; }
    .map {
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 32% 42%, #1d4ed8 0 8px, transparent 9px),
        radial-gradient(circle at 68% 58%, #2563eb 0 6px, transparent 7px),
        radial-gradient(ellipse at 40% 48%, #1e3a8a 0 90px, transparent 140px),
        radial-gradient(ellipse at 62% 62%, #163a6b 0 70px, transparent 120px),
        linear-gradient(180deg, #0b2a4a, #07111f);
    }
    .grid {
      position: absolute; inset: 0; opacity: 0.28;
      background-image:
        linear-gradient(rgba(147,197,253,0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(147,197,253,0.18) 1px, transparent 1px);
      background-size: 36px 36px;
    }
    .pin {
      position: absolute; left: 46%; top: 44%; width: 22px; height: 22px; margin-left: -11px;
      background: #60a5fa; border: 3px solid #fff; border-radius: 50%;
      box-shadow: 0 0 0 10px rgba(96,165,250,0.28);
      opacity: 0; transform: scale(0.4);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .pin.on { opacity: 1; transform: scale(1); animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 8px rgba(96,165,250,0.25); }
      50% { box-shadow: 0 0 0 16px rgba(96,165,250,0.12); }
    }
    .chip {
      position: absolute; z-index: 4;
      background: rgba(15,23,42,0.72); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px; padding: 10px 14px; font-size: 14px; font-weight: 700;
      backdrop-filter: blur(12px); display: flex; align-items: center; gap: 8px;
    }
    .members { top: 48px; left: 16px; }
    .checkin { top: 98px; left: 16px; min-width: 132px; }
    .checkin.glow { box-shadow: 0 0 0 3px rgba(96,165,250,0.45); }
    .memos { top: 48px; right: 16px; }
    .icon { width: 16px; height: 16px; flex-shrink: 0; }
    .spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: absolute; left: 16px; right: 16px; bottom: 28px; z-index: 4;
      background: rgba(15,23,42,0.88); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px; padding: 12px 14px; opacity: 0; transform: translateY(10px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .toast.on { opacity: 1; transform: translateY(0); }
    .toast b { display: block; font-size: 15px; }
    .toast span { color: #93c5fd; font-size: 13px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="copy">
      <p class="kicker" id="kicker">Check in</p>
      <h1 id="title">One tap when you arrive.</h1>
      <p class="sub" id="sub">Your pin drops on the family map — and a memo goes to the bubble.</p>
    </div>
    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <div class="map"></div>
        <div class="grid"></div>
        <div class="pin" id="pin"></div>
        <div class="chip members">🌍 4 Members</div>
        <div class="chip checkin glow" id="checkin">
          <svg class="icon" id="icon" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span id="label">Check in</span>
        </div>
        <div class="chip memos">📝 2 Memos</div>
        <div class="toast" id="toast">
          <b>Ada checked in</b>
          <span>Home · just now</span>
        </div>
      </div>
    </div>
  </div>
  <script>
    const kicker = document.getElementById('kicker');
    const title = document.getElementById('title');
    const sub = document.getElementById('sub');
    const checkin = document.getElementById('checkin');
    const label = document.getElementById('label');
    const icon = document.getElementById('icon');
    const pin = document.getElementById('pin');
    const toast = document.getElementById('toast');
    const pinSvg = icon.innerHTML;
    const spinSvg = '<circle cx="12" cy="12" r="9" stroke="#60a5fa" stroke-width="2.4" stroke-dasharray="16 10"/>';
    const checkSvg = '<path d="M20 6 9 17l-5-5" stroke="#34d399" stroke-width="2.6"/>';
    const animDelayMs = 2600;
    const start = performance.now() + animDelayMs;
    const tick = (now) => {
      if (now < start) { requestAnimationFrame(tick); return; }
      const t = now - start;
      if (t < 3200) {
        kicker.textContent = 'Check in';
        title.innerHTML = 'One tap when you arrive.';
        sub.textContent = 'Your pin drops on the family map — and a memo goes to the bubble.';
        checkin.classList.add('glow');
        label.textContent = 'Check in';
        icon.setAttribute('viewBox', '0 0 24 24');
        icon.innerHTML = pinSvg;
        icon.classList.remove('spin');
        requestAnimationFrame(tick);
        return;
      }
      if (t < 5500) {
        kicker.textContent = 'Checking in';
        title.innerHTML = 'Finding you.';
        sub.textContent = 'Live GPS, then your family sees it.';
        checkin.classList.remove('glow');
        label.textContent = 'Checking in…';
        icon.innerHTML = spinSvg;
        icon.classList.add('spin');
        requestAnimationFrame(tick);
        return;
      }
      kicker.textContent = 'Checked in';
      title.innerHTML = 'You’re on the map.';
      sub.textContent = 'Location plus a family memo — in one tap.';
      label.textContent = 'Checked in';
      icon.classList.remove('spin');
      icon.innerHTML = checkSvg;
      pin.classList.add('on');
      toast.classList.add('on');
    };
    requestAnimationFrame(tick);
  </script>
</body>
</html>
