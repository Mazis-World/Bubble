<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Circular gradient background matching welcome screen -->
  <circle cx="64" cy="64" r="64" fill="url(#logoGradient)"/>
  <!-- White center ring matching welcome screen -->
  <circle cx="64" cy="64" r="32" fill="none" stroke="white" stroke-width="10"/>
</svg>
