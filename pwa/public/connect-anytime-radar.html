<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FamilyBubble radar — connect anytime ad</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: #020617;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    body {
      background:
        radial-gradient(900px 520px at 18% 18%, rgba(59,130,246,0.22), transparent 55%),
        radial-gradient(800px 480px at 88% 82%, rgba(168,85,247,0.18), transparent 50%),
        #020617;
      display: flex; align-items: center; justify-content: center;
    }
    .phone-frame {
      width: 430px; height: 900px; padding: 12px;
      background: #0b1220; border-radius: 54px;
      box-shadow: 0 40px 90px rgba(0,0,0,0.55), 0 0 0 4px #1f2937;
      position: relative;
    }
    .island {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      width: 118px; height: 28px; background: #020617; border-radius: 18px; z-index: 20;
    }
    .screen {
      height: 100%; border-radius: 42px; overflow: hidden; background: #030712;
      display: flex; flex-direction: column;
    }
    .status {
      height: 44px; display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 22px 4px; font-size: 13px; font-weight: 700; color: #e5e7eb;
    }
    header {
      display: flex; align-items: center; padding: 4px 14px 10px;
      background: rgba(15,23,42,0.45);
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .logo {
      width: 28px; height: 28px; border-radius: 10px;
      background: linear-gradient(135deg, #a855f7, #3b82f6, #ec4899);
      display: grid; place-items: center;
    }
    .logo span { width: 11px; height: 14px; border-radius: 50%; border: 2.5px solid #fff; }
    .brand-name {
      font-weight: 800; font-size: 16px;
      background: linear-gradient(135deg, #c4b5fd, #93c5fd, #f9a8d4);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .radar { flex: 1; display: grid; place-items: center; min-height: 0; }
    .radar-disc {
      width: 340px; height: 340px; border-radius: 50%; position: relative;
      background: radial-gradient(circle, rgba(15,23,42,0.95) 0%, rgba(2,6,23,0.98) 100%);
      box-shadow: 0 0 40px rgba(34,211,238,0.28), inset 0 0 30px rgba(34,211,238,0.08);
      border: 2px solid rgba(34,211,238,0.35);
    }
    .ring { position: absolute; inset: 12%; border-radius: 50%; border: 1px solid rgba(56,189,248,0.28); }
    .ring.r2 { inset: 24%; } .ring.r3 { inset: 36%; } .ring.r4 { inset: 48%; }
    .sweep {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(34,211,238,0.32) 0deg, rgba(59,130,246,0.1) 50deg, transparent 95deg);
      animation: sweep 3.2s linear infinite;
    }
    @keyframes sweep { to { transform: rotate(360deg); } }
    .face {
      position: absolute; width: 54px; height: 54px; border-radius: 50%;
      display: grid; place-items: center; font-size: 22px; font-weight: 800; color: #fff;
      border: 3px solid #fff; box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    }
    .face small { position: absolute; bottom: -6px; right: -4px; font-size: 16px; line-height: 1; }
    .you { left: 50%; top: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, #a855f7, #3b82f6); }
    .dad { left: 22%; top: 28%; background: linear-gradient(135deg, #3b82f6, #22d3ee); }
    .kid { right: 18%; top: 58%; background: linear-gradient(135deg, #f472b6, #a855f7); }
    .home {
      left: 18%; top: 62%; width: 46px; height: 46px; border-radius: 16px;
      background: #0f172a; border: 2px solid #60a5fa; font-size: 22px;
      display: grid; place-items: center; position: absolute;
      box-shadow: 0 0 16px rgba(96,165,250,0.4);
    }
    .caption { text-align: center; padding: 16px 20px 28px; color: #cbd5e1; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="island"></div>
    <div class="screen">
      <div class="status"><span>9:41</span><span>5G 🔋</span></div>
      <header>
        <div class="brand">
          <div class="logo"><span></span></div>
          <div class="brand-name">FamilyBubble</div>
        </div>
      </header>
      <div class="radar">
        <div class="radar-disc">
          <div class="sweep"></div>
          <div class="ring"></div>
          <div class="ring r2"></div>
          <div class="ring r3"></div>
          <div class="ring r4"></div>
          <div class="home">🏠</div>
          <div class="face dad">D<small>✅</small></div>
          <div class="face you">A<small>🚗</small></div>
          <div class="face kid">L<small>🏠</small></div>
        </div>
      </div>
      <p class="caption">Dad’s at work. Liam’s home.</p>
    </div>
  </div>
</body>
</html>
