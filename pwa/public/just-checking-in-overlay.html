<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FamilyBubble extracted check-in</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: #FF00FF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    .stage {
      width: 1920px; height: 1080px;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 56px;
    }
    /* Same phone chrome as just-checking-in-ad.html, cropped to the check-in. */
    .phone {
      width: 430px;
      padding: 12px 12px 22px;
      background: #0b1220;
      border-radius: 54px;
      box-shadow: 0 0 0 4px #1f2937;
      position: relative;
    }
    .island {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      width: 118px; height: 28px; background: #020617; border-radius: 18px; z-index: 20;
    }
    .screen {
      border-radius: 42px; overflow: hidden;
      background: linear-gradient(180deg, #0b1220, #020617);
      padding-bottom: 8px;
    }
    .status {
      height: 44px; display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 22px 4px; font-size: 13px; font-weight: 700; color: #e5e7eb;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px 4px;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .logo {
      width: 28px; height: 28px; border-radius: 10px;
      background: linear-gradient(135deg, #a855f7, #3b82f6, #ec4899);
      display: grid; place-items: center;
    }
    .logo span { width: 11px; height: 14px; border-radius: 50%; border: 2.5px solid #fff; }
    .brand-name {
      font-weight: 800; font-size: 17px;
      background: linear-gradient(135deg, #c4b5fd, #93c5fd, #f9a8d4);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .panel { padding: 4px 16px 18px; }
    .kicker {
      font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
      color: #93c5fd; font-weight: 700; margin-bottom: 8px;
    }
    .title { font-size: 28px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 16px; }
    .row {
      display: flex; align-items: center; gap: 12px;
      background: rgba(244, 114, 182, 0.12);
      border: 1px solid rgba(244, 114, 182, 0.4);
      border-radius: 20px; padding: 12px 14px;
      box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.18);
    }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
      font-weight: 800; font-size: 18px; color: #fff; flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.7);
      background: linear-gradient(135deg, #f472b6, #db2777);
    }
    .who { font-weight: 800; font-size: 16px; }
    .where { color: #cbd5e1; font-size: 13px; margin-top: 2px; }
    .meta {
      display: flex; align-items: center; gap: 8px;
      margin-top: 12px; color: #86efac; font-size: 14px; font-weight: 700;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #4ade80;
      box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.18);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="island"></div>
      <div class="screen">
        <div class="status"><span>5:42</span><span>5G 🔋</span></div>
        <header>
          <div class="brand"><div class="logo"><span></span></div><span class="brand-name">FamilyBubble</span></div>
        </header>
        <div class="panel">
          <p class="kicker">Your bubble</p>
          <h1 class="title">Just checking in</h1>
          <div class="row">
            <div class="avatar">G</div>
            <div>
              <div class="who">Grandma</div>
              <div class="where">Home ❤️</div>
            </div>
          </div>
          <p class="meta"><span class="dot"></span>Checked in · Just now</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
