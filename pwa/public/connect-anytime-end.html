<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FamilyBubble end card</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      background:
        radial-gradient(700px 400px at 50% 40%, rgba(168,85,247,0.22), transparent 60%),
        #020617;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    }
    .line {
      font-size: 54px; font-weight: 800; letter-spacing: -0.03em;
      text-align: center; max-width: 1200px; line-height: 1.15;
    }
    .mark { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
    .mark img { width: 56px; height: 56px; }
    .mark-name {
      font-size: 42px; font-weight: 800;
      background: linear-gradient(135deg, #c4b5fd, #93c5fd, #f9a8d4);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .url { color: #86efac; font-size: 22px; font-weight: 600; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <p class="line">Connect with your family at any time.</p>
  <div class="mark">
    <img src="familybubble-logo-icon-only-256x256.png" alt="FamilyBubble" />
    <div class="mark-name">FamilyBubble</div>
  </div>
  <p class="url">familybubble.online</p>
</body>
</html>
