<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FamilyBubble — Just Checking In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      background:
        radial-gradient(1000px 620px at 18% 12%, rgba(168,85,247,0.28), transparent 55%),
        radial-gradient(900px 560px at 88% 88%, rgba(59,130,246,0.22), transparent 50%),
        #020617;
    }
    .stage {
      width: 1920px; height: 1080px;
      display: flex; align-items: center; justify-content: center; gap: 72px;
    }
    .phone {
      width: 430px; height: 900px; padding: 12px;
      background: #0b1220; border-radius: 54px;
      box-shadow: 0 40px 90px rgba(0,0,0,0.55), 0 0 0 4px #1f2937;
      position: relative;
      transform: translateY(24px);
      opacity: 0;
      animation: rise 0.8s ease forwards;
    }
    .phone.b { animation-delay: 5.4s; }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    .island {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      width: 118px; height: 28px; background: #020617; border-radius: 18px; z-index: 20;
    }
    .screen {
      height: 100%; border-radius: 42px; overflow: hidden;
      background: linear-gradient(180deg, #0b1220, #020617);
      position: relative; display: flex; flex-direction: column;
    }
    .status {
      height: 44px; display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 22px 4px; font-size: 13px; font-weight: 700; color: #e5e7eb; z-index: 6;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px 12px;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .logo {
      width: 28px; height: 28px; border-radius: 10px;
      background: linear-gradient(135deg, #a855f7, #3b82f6, #ec4899);
      display: grid; place-items: center;
    }
    .logo span { width: 11px; height: 14px; border-radius: 50%; border: 2.5px solid #fff; }
    .brand-name {
      font-weight: 800; font-size: 17px;
      background: linear-gradient(135deg, #c4b5fd, #93c5fd, #f9a8d4);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .panel { flex: 1; padding: 8px 16px 20px; overflow: hidden; }
    .kicker { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #93c5fd; font-weight: 700; margin-bottom: 8px; }
    .title { font-size: 28px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 16px; }
    .row {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 12px 14px; margin-bottom: 10px;
    }
    .row.tap {
      animation: tapglow 0.6s ease 2.6s forwards;
    }
    @keyframes tapglow {
      50% { transform: scale(0.98); box-shadow: 0 0 0 3px rgba(244,114,182,0.45); }
      100% { transform: scale(1); background: rgba(244,114,182,0.12); border-color: rgba(244,114,182,0.4); }
    }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
      font-weight: 800; font-size: 18px; color: #fff; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.7);
    }
    .dad { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .emma { background: linear-gradient(135deg, #22c55e, #15803d); }
    .grandma { background: linear-gradient(135deg, #f472b6, #db2777); }
    .who { font-weight: 800; font-size: 16px; }
    .where { color: #cbd5e1; font-size: 13px; margin-top: 2px; }
    .view { position: absolute; inset: 44px 0 0; padding: 8px 16px 20px; opacity: 0; pointer-events: none; }
    .view.on { opacity: 1; animation: fadein 0.45s ease; }
    @keyframes fadein { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .cta {
      margin-top: 18px; width: 100%; border: 0; border-radius: 16px; padding: 16px;
      background: linear-gradient(90deg, #3b82f6, #a855f7);
      color: #fff; font-weight: 800; font-size: 17px;
    }
    .cta.press { animation: press 0.5s ease 5.15s forwards; }
    @keyframes press { 40% { transform: scale(0.96); } 100% { transform: scale(1); filter: brightness(1.15); } }
    .meta { color: #94a3b8; font-size: 14px; margin-top: 8px; }
    .notif {
      margin-top: 28px; background: rgba(15,23,42,0.94);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 22px; padding: 16px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.4);
      transform: translateY(-16px); opacity: 0;
      animation: drop 0.55s ease 6.1s forwards;
    }
    @keyframes drop { to { opacity: 1; transform: none; } }
    .notif b { display: block; font-size: 15px; margin-bottom: 4px; }
    .reply {
      margin-top: 14px; width: 100%; border: 0; border-radius: 14px; padding: 12px;
      background: rgba(244,114,182,0.18); color: #fecdd3; font-weight: 800; font-size: 15px;
      animation: press 0.5s ease 7.6s forwards;
    }
    .done {
      margin-top: 16px; text-align: center; color: #86efac; font-weight: 700; opacity: 0;
      animation: fadein 0.4s ease 8.3s forwards;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone a">
      <div class="island"></div>
      <div class="screen">
        <div class="status"><span>5:42</span><span>5G 🔋</span></div>
        <div class="view on" id="list">
          <header>
            <div class="brand"><div class="logo"><span></span></div><span class="brand-name">FamilyBubble</span></div>
          </header>
          <div class="panel">
            <p class="kicker">Your bubble</p>
            <h1 class="title">Just checking in</h1>
            <div class="row">
              <div class="avatar dad">D</div>
              <div><div class="who">Dad</div><div class="where">Home 🏠</div></div>
            </div>
            <div class="row">
              <div class="avatar emma">E</div>
              <div><div class="who">Emma</div><div class="where">School 🎒</div></div>
            </div>
            <div class="row tap">
              <div class="avatar grandma">G</div>
              <div><div class="who">Grandma</div><div class="where">Home ❤️</div></div>
            </div>
          </div>
        </div>
        <div class="view" id="profile">
          <header>
            <div class="brand"><div class="logo"><span></span></div><span class="brand-name">FamilyBubble</span></div>
          </header>
          <div class="panel">
            <div class="avatar grandma" style="width:84px;height:84px;font-size:32px;margin:8px auto 12px;">G</div>
            <h1 class="title" style="text-align:center">Grandma</h1>
            <p class="where" style="text-align:center;font-size:16px">Home 🏠</p>
            <p class="meta" style="text-align:center">Last checked in: Today</p>
            <button class="cta press">Check In</button>
          </div>
        </div>
      </div>
    </div>
    <div class="phone b">
      <div class="island"></div>
      <div class="screen">
        <div class="status"><span>5:42</span><span>5G 🔋</span></div>
        <div class="panel" style="padding-top:28px">
          <p class="kicker">Grandma’s phone</p>
          <div class="notif">
            <div class="brand" style="margin-bottom:10px">
              <div class="logo"><span></span></div>
              <span class="brand-name">FamilyBubble</span>
            </div>
            <b>❤️ Mom checked in on you.</b>
            <p class="meta">Just now</p>
            <button class="reply">I’m good ❤️</button>
            <p class="done">Sent</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    setTimeout(() => {
      document.getElementById('list').classList.remove('on');
      document.getElementById('profile').classList.add('on');
    }, 3200);
  </script>
</body>
</html>
