<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Logo icon -->
  <g transform="translate(0, 0)">
    <rect width="200" height="200" rx="24" fill="url(#logoGradient)" filter="url(#shadow)"/>
    <circle cx="100" cy="100" r="50" fill="white" opacity="0.95"/>
    <circle cx="100" cy="100" r="35" fill="url(#logoGradient)" opacity="0.8"/>
  </g>
  <!-- FamilyBubble text -->
  <text x="240" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="bold" fill="url(#textGradient)">
    FamilyBubble
  </text>
</svg>
