<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FamilyBubble — They're okay.</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05070d; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      color: #fff;
    }
    .bg {
      position: absolute; inset: -40px;
      background: url("ad-assets/okay/shelf-phone.png") center / cover no-repeat;
      filter: blur(18px) saturate(0.85) brightness(0.42);
      transform: scale(1.08);
    }
    .vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 42%, transparent 20%, rgba(0,0,0,0.55) 80%);
    }
    .stage {
      position: relative; width: 1920px; height: 1080px;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      width: 560px;
      background: rgba(28, 28, 30, 0.72);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 28px;
      padding: 18px 20px 20px;
      backdrop-filter: blur(28px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      opacity: 0;
      transform: translateY(28px) scale(0.96);
      animation: pop 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
    }
    @keyframes pop {
      to { opacity: 1; transform: none; }
    }
    .row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #a855f7, #3b82f6, #ec4899);
      display: grid; place-items: center; flex-shrink: 0;
    }
    .logo span {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2.5px solid #fff;
    }
    .app {
      font-size: 15px; font-weight: 800; letter-spacing: 0.01em;
    }
    .now { margin-left: auto; color: #cbd5e1; font-size: 13px; font-weight: 600; }
    h1 {
      font-size: 28px; font-weight: 800; line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .ok {
      margin-top: 8px; font-size: 22px; font-weight: 650; color: #bbf7d0;
      opacity: 0;
      animation: pop 0.6s ease 1.35s forwards;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="vignette"></div>
  <div class="stage">
    <article class="card" aria-label="FamilyBubble notification">
      <div class="row">
        <div class="logo"><span></span></div>
        <div class="app">FamilyBubble</div>
        <div class="now">now</div>
      </div>
      <h1>📍 Liam checked in at Home</h1>
      <p class="ok">They're okay.</p>
    </article>
  </div>
</body>
</html>
